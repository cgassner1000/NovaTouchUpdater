name: NovaTouchUpdater Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Windows-x64-EXE bauen
        shell: cmd
        run: call Build-win64.cmd

      - name: EXE pruefen
        shell: pwsh
        run: |
          $publishDir = 'bin/Release/net8.0-windows/win-x64/publish'
          $exe = Join-Path $publishDir 'NovaTouchUpdater.exe'

          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Write-Host 'Gefundene EXE-Dateien:'
            Get-ChildItem -Path 'bin/Release' -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length | Format-Table -AutoSize
            throw "Build fehlgeschlagen: $exe nicht gefunden."
          }

          Get-ChildItem -Path $publishDir -File |
            Select-Object Name, Length | Format-Table -AutoSize

          $sizeMB = [math]::Round((Get-Item -LiteralPath $exe).Length / 1MB, 2)
          Write-Host "EXE erfolgreich erstellt: $sizeMB MB"

      - name: GitHub Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
        run: |
          gh release create "$env:RELEASE_TAG" "bin/Release/net8.0-windows/win-x64/publish/NovaTouchUpdater.exe" `
            --target "$env:GITHUB_SHA" `
            --title "NovaTouchUpdater $env:RELEASE_TAG" `
            --generate-notes `
            --latest

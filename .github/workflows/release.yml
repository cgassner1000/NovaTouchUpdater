
name: NovaTouchUpdater Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Windows-x64-EXE bauen
        shell: cmd
        run: call Build-win64.cmd

      - name: EXE pruefen und mit Versionsnummer benennen
        shell: pwsh
        run: |
          $publishDir = 'bin/Release/net8.0-windows/win-x64/publish'
          $exe = Join-Path $publishDir 'NovaTouchUpdater.exe'

          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Write-Host 'Gefundene EXE-Dateien:'
            Get-ChildItem -Path 'bin/Release' -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length | Format-Table -AutoSize
            throw "Build fehlgeschlagen: $exe nicht gefunden."
          }

          $versionedName = "NovaTouchUpdater-v1.0.$env:GITHUB_RUN_NUMBER.exe"
          Rename-Item -LiteralPath $exe -NewName $versionedName
          $versionedExe = Join-Path $publishDir $versionedName

          Get-ChildItem -Path $publishDir -File |
            Select-Object Name, Length | Format-Table -AutoSize

          $sizeMB = [math]::Round((Get-Item -LiteralPath $versionedExe).Length / 1MB, 2)
          Write-Host "EXE erfolgreich erstellt: $versionedName ($sizeMB MB)"

      - name: GitHub Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
        run: |
          $releaseExe = "bin/Release/net8.0-windows/win-x64/publish/NovaTouchUpdater-$env:RELEASE_TAG.exe"
          gh release create "$env:RELEASE_TAG" "$releaseExe" `
            --target "$env:GITHUB_SHA" `
            --title "NovaTouchUpdater $env:RELEASE_TAG" `
            --generate-notes `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release konnte nicht erstellt werden: $env:RELEASE_TAG"
          }

      - name: Nur die 3 neuesten Releases behalten
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh api --paginate `
            "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
            --slurp
          if ($LASTEXITCODE -ne 0) {
            throw "Releases konnten nicht geladen werden."
          }

          $releases = @($json | ConvertFrom-Json |
            ForEach-Object { $_ } |
            ForEach-Object { $_ } |
            Where-Object { -not $_.draft } |
            Sort-Object published_at -Descending)

          foreach ($release in ($releases | Select-Object -Skip 3)) {
            gh release delete "$($release.tag_name)" `
              --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw "Loeschen fehlgeschlagen: $($release.tag_name)"
            }
          }

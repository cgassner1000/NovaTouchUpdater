
name: NovaTouchUpdater Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novatouchupdater-releases
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Naechste Buildnummer der Versionsreihe bestimmen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/Release.ps1 -Mode Prepare

      - name: Windows-x64-EXE bauen
        shell: cmd
        run: call Build-win64.cmd

      - name: EXE pruefen und mit Versionsnummer benennen
        shell: pwsh
        run: |
          $publishDir = 'artifacts/publish/win-x64'
          $exe = Join-Path $publishDir 'NovaTouchUpdater.exe'

          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Write-Host 'Gefundene EXE-Dateien:'
            Get-ChildItem -Path 'artifacts' -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length | Format-Table -AutoSize
            throw "Build fehlgeschlagen: $exe nicht gefunden."
          }

          $exe = (Resolve-Path -LiteralPath $exe).ProviderPath
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          if ($version) { $version = $version.Split('+')[0] }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Keine gueltige Versionsnummer in der EXE gefunden: $version"
          }
          if ($version -ne $env:UPDATER_RELEASE_VERSION) {
            throw "EXE-Version $version entspricht nicht der vorbereiteten Release-Version $env:UPDATER_RELEASE_VERSION."
          }
          $releaseTag = "v$version"
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $versionedName = "NovaTouchUpdater-$releaseTag.exe"
          Rename-Item -LiteralPath $exe -NewName $versionedName
          $versionedExe = Join-Path $publishDir $versionedName

          Get-ChildItem -Path $publishDir -File |
            Select-Object Name, Length | Format-Table -AutoSize

          $sizeMB = [math]::Round((Get-Item -LiteralPath $versionedExe).Length / 1MB, 2)
          Write-Host "EXE erfolgreich erstellt: $versionedName ($sizeMB MB)"

      - name: GitHub Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseExe = "artifacts/publish/win-x64/NovaTouchUpdater-$env:RELEASE_TAG.exe"
          gh release create "$env:RELEASE_TAG" "$releaseExe" `
            --target "$env:GITHUB_SHA" `
            --title "NovaTouchUpdater $env:RELEASE_TAG" `
            --generate-notes `
            --latest=false
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release konnte nicht erstellt werden: $env:RELEASE_TAG"
          }

      - name: Aktuelle Reihe mit 3 Releases und aeltere Reihen mit je einem Release behalten
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/Release.ps1 -Mode Cleanup -ExpectedVersion $env:UPDATER_RELEASE_VERSION
